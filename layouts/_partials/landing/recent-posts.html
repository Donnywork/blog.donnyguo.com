<section id="{{ .id }}" class="td-landing-section td-landing-cards-section" aria-labelledby="{{ .id }}-title">
  <div class="td-site-container">
    {{ partial "landing/heading.html" (dict "page" .page "data" .data "id" .id) }}
    <div class="td-content-cards td-blog-cards" style="--td-card-columns: {{ .page.Site.Params.ui.blog_index_columns }}">
      {{ range first 6 (where .page.Site.RegularPages "Section" "blog").ByDate.Reverse }}
      {{ partial "shell/blog-card.html" . }}
      {{ end }}
    </div>
  </div>
</section>
