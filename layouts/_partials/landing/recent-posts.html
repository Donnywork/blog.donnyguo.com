<section id="{{ .id }}" class="td-landing-section td-landing-cards-section" aria-labelledby="{{ .id }}-title">
  <div class="td-site-container">
    {{ partial "landing/heading.html" (dict "page" .page "data" .data "id" .id) }}
    <div class="td-landing-card-grid" style="--td-columns: 2">
      {{ range first 6 (where .page.Site.RegularPages "Section" "blog").ByDate.Reverse }}
      <article class="td-landing-card">
        <p class="td-landing-card__meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></p>
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <div class="td-landing-card__description">{{ .Description }}</div>
        <a class="td-landing-card-link" href="{{ .RelPermalink }}">{{ $.data.link_label }}<i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
      </article>
      {{ end }}
    </div>
  </div>
</section>
